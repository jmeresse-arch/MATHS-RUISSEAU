  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

,sans-serif;font-weight:800;font-size:34px;line-height:1.1;margin:0;letter-spacing:-0.5px\">Le théorème de Thalès<\u002Fh1>\n<span style=\"font-size:13px;font-weight:700;color:#5b6475;text-transform:uppercase;letter-spacing:1.5px\">Mathématiques · 3<sup>e<\u002Fsup><\u002Fspan>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline\"><span style=\"color:#2457a6\">1.<\u002Fspan> Rappel : la quatrième proportionnelle (produit en croix)<\u002Fh2>\n<p style=\"margin:0 0 12px\">Dans un tableau de proportionnalité (ou une égalité de deux fractions), on peut toujours calculer le nombre manquant.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:28px;align-items:center;break-inside:avoid;margin-bottom:12px\">\n<sc-raw-table style=\"border-collapse:collapse;font-size:22px;text-align:center\">\n<sc-raw-tr><sc-raw-td style=\"border:1.5px solid #1d2433;width:52px;height:44px;background:#eef2f8\">a<\u002Fsc-raw-td><sc-raw-td style=\"border:1.5px solid #1d2433;width:52px;height:44px\">b<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"border:1.5px solid #1d2433;width:52px;height:44px\">c<\u002Fsc-raw-td><sc-raw-td style=\"border:1.5px solid #1d2433;width:52px;height:44px\">d<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-table>\n<div style=\"font-size:18px;line-height:1.9;font-style:italic\">\n<div>a = b × c ÷ d<\u002Fdiv><div>b = a × d ÷ c<\u002Fdiv><div>c = a × d ÷ b<\u002Fdiv><div>d = c × b ÷ a<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#eef2f8;border-radius:6px;padding:12px 16px;font-size:14px\">\n<div style=\"font-weight:700;margin-bottom:4px\">Astuce<\u002Fdiv>\nOn multiplie les deux nombres <b>en diagonale<\u002Fb>, puis on divise par le <b>troisième<\u002Fb> nombre.\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid;border:1.5px solid #d5dbe6;border-radius:6px;padding:10px 16px;margin-bottom:26px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center\">\n<span style=\"font-weight:700\">Exemple :<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:16px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\"><i>x<\u002Fi><\u002Fspan><span style=\"padding:0 4px\">4<\u002Fspan><\u002Fspan>\n=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">6<\u002Fspan><span style=\"padding:0 4px\">8<\u002Fspan><\u002Fspan>\n<\u002Fspan>\n<span>donc <i>x<\u002Fi> = 4 × 6 ÷ 8 = 24 ÷ 8 = <b>3<\u002Fb><\u002Fspan>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline\"><span style=\"color:#2457a6\">2.<\u002Fspan> Le théorème de Thalès<\u002Fh2>\n\n<div style=\"break-inside:avoid;border:2px solid #2457a6;border-radius:8px;overflow:hidden;margin-bottom:10px\">\n<div style=\"background:#2457a6;color:#fff;font-weight:700;padding:6px 16px;font-size:14px;letter-spacing:1px;text-transform:uppercase\">Théorème<\u002Fdiv>\n<div style=\"padding:14px 18px\">\n<p style=\"margin:0 0 10px;text-wrap:pretty\">Soient deux droites (d) et (d') sécantes en A.<br>B et M sont deux points de (d) distincts de A.<br>C et N sont deux points de (d') distincts de A.<\u002Fp>\n<p style=\"margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px\">Si les droites <b style=\"color:#2457a6\">(BC) et (MN) sont parallèles<\u002Fb>, alors\n<span style=\"display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;background:#fff7d6;padding:6px 12px;border-radius:6px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">AM<\u002Fspan><span style=\"padding:0 4px\">AB<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">AN<\u002Fspan><span style=\"padding:0 4px\">AC<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">MN<\u002Fspan><span style=\"padding:0 4px\">BC<\u002Fspan><\u002Fspan>\n<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:14px 0 6px\">\n<figure style=\"margin:0;text-align:center\">\n<svg sc-camel-view-box=\"0 0 230 205\" style=\"width:100%;max-width:250px;height:auto\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<polygon points=\"110,20 40,170 190,170\" fill=\"#fff7d6\"><\u002Fpolygon>\n<polygon points=\"110,20 75,95 150,95\" fill=\"#fde68a\"><\u002Fpolygon>\n<line x1=\"118.4\" y1=\"2\" x2=\"29.5\" y2=\"192.5\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"100.4\" y1=\"2\" x2=\"202\" y2=\"192.5\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"15\" y1=\"170\" x2=\"215\" y2=\"170\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<line x1=\"50\" y1=\"95\" x2=\"175\" y2=\"95\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<g fill=\"#1d2433\"><circle cx=\"110\" cy=\"20\" r=\"2.5\"><\u002Fcircle><circle cx=\"75\" cy=\"95\" r=\"2.5\"><\u002Fcircle><circle cx=\"150\" cy=\"95\" r=\"2.5\"><\u002Fcircle><circle cx=\"40\" cy=\"170\" r=\"2.5\"><\u002Fcircle><circle cx=\"190\" cy=\"170\" r=\"2.5\"><\u002Fcircle><\u002Fg>\n<g font-weight=\"700\"><text x=\"119\" y=\"22\">A<\u002Ftext><text x=\"60\" y=\"90\">M<\u002Ftext><text x=\"155\" y=\"90\">N<\u002Ftext><text x=\"26\" y=\"165\">B<\u002Ftext><text x=\"196\" y=\"165\">C<\u002Ftext><\u002Fg>\n<g fill=\"#5b6475\"><text x=\"8\" y=\"200\">(d)<\u002Ftext><text x=\"200\" y=\"200\">(d')<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<figcaption style=\"font-size:12.5px;color:#5b6475\">Configuration « triangles emboîtés »<\u002Ffigcaption>\n<\u002Ffigure>\n<figure style=\"margin:0;text-align:center\">\n<svg sc-camel-view-box=\"0 0 230 205\" style=\"width:100%;max-width:250px;height:auto\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<polygon points=\"115,100 73,76 157,76\" fill=\"#fde68a\"><\u002Fpolygon>\n<polygon points=\"115,100 185,140 45,140\" fill=\"#fde68a\"><\u002Fpolygon>\n<line x1=\"40\" y1=\"57\" x2=\"210\" y2=\"154\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"190\" y1=\"57\" x2=\"20\" y2=\"154\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"20\" y1=\"140\" x2=\"215\" y2=\"140\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<line x1=\"45\" y1=\"76\" x2=\"190\" y2=\"76\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<g fill=\"#1d2433\"><circle cx=\"115\" cy=\"100\" r=\"2.5\"><\u002Fcircle><circle cx=\"73\" cy=\"76\" r=\"2.5\"><\u002Fcircle><circle cx=\"157\" cy=\"76\" r=\"2.5\"><\u002Fcircle><circle cx=\"185\" cy=\"140\" r=\"2.5\"><\u002Fcircle><circle cx=\"45\" cy=\"140\" r=\"2.5\"><\u002Fcircle><\u002Fg>\n<g font-weight=\"700\"><text x=\"110\" y=\"122\">A<\u002Ftext><text x=\"66\" y=\"68\">M<\u002Ftext><text x=\"155\" y=\"68\">N<\u002Ftext><text x=\"186\" y=\"158\">B<\u002Ftext><text x=\"36\" y=\"158\">C<\u002Ftext><\u002Fg>\n<g fill=\"#5b6475\"><text x=\"22\" y=\"52\">(d)<\u002Ftext><text x=\"186\" y=\"52\">(d')<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<figcaption style=\"font-size:12.5px;color:#5b6475\">Configuration « papillon »<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n\n<p style=\"margin:0 0 18px;font-size:14px\"><b>Remarque :<\u002Fb> ce théorème permet de <b>calculer des longueurs<\u002Fb> dans une configuration de Thalès.<\u002Fp>\n\n<div style=\"break-inside:avoid;background:#eef2f8;border-radius:8px;padding:14px 18px;margin-bottom:26px\">\n<div style=\"font-weight:700;margin-bottom:6px\">Méthode — rédiger une démonstration<\u002Fdiv>\n<ol style=\"margin:0;padding-left:20px;display:grid;gap:3px\">\n<li>Citer les droites <b>sécantes<\u002Fb> et le point d'intersection.<\u002Fli>\n<li>Citer les droites <b>parallèles<\u002Fb>.<\u002Fli>\n<li>Écrire « D'après le théorème de Thalès » et l'égalité des trois rapports, en partant du point d'intersection : <i>petit triangle<\u002Fi> au numérateur, <i>grand triangle<\u002Fi> au dénominateur.<\u002Fli>\n<li>Remplacer par les longueurs connues.<\u002Fli>\n<li>Choisir deux rapports avec une seule inconnue et utiliser le <b>produit en croix<\u002Fb>.<\u002Fli>\n<li>Conclure avec l'unité.<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n\n<h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:21px;margin:0 0 10px;display:flex;gap:10px;align-items:baseline;break-before:page\"><span style=\"color:#2457a6\">3.<\u002Fspan> Exemples corrigés<\u002Fh2>\n\n<div style=\"break-inside:avoid;margin-bottom:26px\">\n<h3 style=\"font-size:16px;margin:0 0 6px\">Exemple 1 — triangles emboîtés<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:start\">\n<p style=\"margin:0;text-wrap:pretty\">Les droites (OL) et (TE) sont parallèles. O appartient à [HT] et L appartient à [HE].<br>On donne HE = 5 cm, HL = 2 cm, TE = 7 cm et HO = 3 cm.<br><b>Calculer les longueurs HT et OL.<\u002Fb><\u002Fp>\n<svg sc-camel-view-box=\"0 0 240 215\" style=\"width:100%;height:auto\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<polygon points=\"140,20 30,190 210,190\" fill=\"#fff7d6\"><\u002Fpolygon>\n<polygon points=\"140,20 96,88 168,88\" fill=\"#fde68a\"><\u002Fpolygon>\n<line x1=\"140\" y1=\"20\" x2=\"30\" y2=\"190\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"140\" y1=\"20\" x2=\"210\" y2=\"190\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"15\" y1=\"190\" x2=\"228\" y2=\"190\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<line x1=\"70\" y1=\"88\" x2=\"200\" y2=\"88\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<g font-weight=\"700\"><text x=\"134\" y=\"14\">H<\u002Ftext><text x=\"80\" y=\"84\">O<\u002Ftext><text x=\"174\" y=\"84\">L<\u002Ftext><text x=\"18\" y=\"207\">T<\u002Ftext><text x=\"212\" y=\"207\">E<\u002Ftext><\u002Fg>\n<g fill=\"#2457a6\" font-size=\"11.5\"><text x=\"96\" y=\"52\">3 cm<\u002Ftext><text x=\"158\" y=\"52\">2 cm<\u002Ftext><text x=\"196\" y=\"140\">5 cm<\u002Ftext><text x=\"108\" y=\"207\">7 cm<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n<div style=\"border-left:3px solid #2457a6;padding:4px 0 4px 16px;margin-top:8px\">\n<p style=\"margin:0 0 6px\">Les droites (OT) et (LE) sont sécantes en H. Les droites (OL) et (TE) sont parallèles.<\u002Fp>\n<p style=\"margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px\">D'après le théorème de Thalès :\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:16px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">HO<\u002Fspan><span style=\"padding:0 4px\">HT<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">HL<\u002Fspan><span style=\"padding:0 4px\">HE<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">OL<\u002Fspan><span style=\"padding:0 4px\">TE<\u002Fspan><\u002Fspan>\n<\u002Fspan>\nsoit\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:16px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">3<\u002Fspan><span style=\"padding:0 4px;color:#b4232c;font-weight:700\">HT<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">2<\u002Fspan><span style=\"padding:0 4px\">5<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px;color:#b4232c;font-weight:700\">OL<\u002Fspan><span style=\"padding:0 4px\">7<\u002Fspan><\u002Fspan>\n<\u002Fspan><\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<div><b>Calcul de HT<\u002Fb><br>HT = 3 × 5 ÷ 2 = 7,5<br>donc <b>HT = 7,5 cm<\u002Fb>.<\u002Fdiv>\n<div><b>Calcul de OL<\u002Fb><br>OL = 2 × 7 ÷ 5 = 2,8<br>donc <b>OL = 2,8 cm<\u002Fb>.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"break-inside:avoid;margin-bottom:10px\">\n<h3 style=\"font-size:16px;margin:0 0 6px\">Exemple 2 — configuration papillon<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:start\">\n<p style=\"margin:0;text-wrap:pretty\">Les droites (CD) et (HT) sont parallèles. Les droites (DH) et (CT) sont sécantes en G.<br>On donne DG = 25 mm, GH = 45 mm, CG = 20 mm et HT = 27 mm.<br><b>Calculer GT et CD.<\u002Fb><\u002Fp>\n<svg sc-camel-view-box=\"0 0 230 185\" style=\"width:100%;height:auto\" font-family=\"Atkinson Hyperlegible, sans-serif\" font-size=\"13\">\n<polygon points=\"120,100 164.4,66.7 81.1,66.7\" fill=\"#fde68a\"><\u002Fpolygon>\n<polygon points=\"120,100 40,160 190,160\" fill=\"#fde68a\"><\u002Fpolygon>\n<line x1=\"182\" y1=\"53.5\" x2=\"27\" y2=\"169.75\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"66\" y1=\"54\" x2=\"200\" y2=\"168.6\" stroke=\"#1d2433\" stroke-width=\"1.5\"><\u002Fline>\n<line x1=\"60\" y1=\"66.7\" x2=\"186\" y2=\"66.7\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<line x1=\"20\" y1=\"160\" x2=\"212\" y2=\"160\" stroke=\"#2457a6\" stroke-width=\"2\"><\u002Fline>\n<g font-weight=\"700\"><text x=\"114\" y=\"124\">G<\u002Ftext><text x=\"50\" y=\"62\">C<\u002Ftext><text x=\"186\" y=\"62\">D<\u002Ftext><text x=\"44\" y=\"178\">H<\u002Ftext><text x=\"176\" y=\"178\">T<\u002Ftext><\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n<div style=\"border-left:3px solid #2457a6;padding:4px 0 4px 16px;margin-top:8px\">\n<p style=\"margin:0 0 6px\">Les droites (DH) et (CT) sont sécantes en G. Les droites (CD) et (HT) sont parallèles.<\u002Fp>\n<p style=\"margin:0 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px\">D'après le théorème de Thalès :\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:16px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">GC<\u002Fspan><span style=\"padding:0 4px\">GT<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">GD<\u002Fspan><span style=\"padding:0 4px\">GH<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">CD<\u002Fspan><span style=\"padding:0 4px\">HT<\u002Fspan><\u002Fspan>\n<\u002Fspan>\nsoit\n<span style=\"display:inline-flex;align-items:center;gap:6px;font-size:16px\">\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">20<\u002Fspan><span style=\"padding:0 4px;color:#b4232c;font-weight:700\">GT<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px\">25<\u002Fspan><span style=\"padding:0 4px\">45<\u002Fspan><\u002Fspan>=\n<span style=\"display:inline-flex;flex-direction:column;align-items:center;line-height:1.2\"><span style=\"border-bottom:1.5px solid currentColor;padding:0 4px;color:#b4232c;font-weight:700\">CD<\u002Fspan><span style=\"padding:0 4px\">27<\u002Fspan><\u002Fspan>\n<\u002Fspan><\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<div><b>Calcul de GT<\u002Fb><br>GT = 45 × 20 ÷ 25 = 36<br>donc <b>GT = 36 mm<\u002Fb>.<\u002Fdiv>\n<div><b>Calcul de CD<\u002Fb><br>CD = 25 × 27 ÷ 45 = 15<br>donc <b>CD = 15 mm<\u002Fb>.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
